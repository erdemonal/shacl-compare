[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shacl-compare"
version = "0.1.0"
description = "A Python tool for comparing RDF data repairs and SHACL constraint revisions."
requires-python = ">=3.10"
dependencies = [
  "pyshacl>=0.30.1,<0.41",
  "rdflib>=7.1.4,<8",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
shacl-compare = "shacl_compare.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
